<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFT Sync</title>
<style>
:root{--bg:#04202b;--line:#2c3f4a;--tx:#e8eaee;--mut:#8f97a6;--ok:#4fd1a1;--warn:#f2b84b;--err:#ff7b7b;--up:#7db4ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:10px;padding:12px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.pill[data-s=synced] i{background:var(--ok)}
.pill[data-s=syncing] i{background:var(--up)}
.pill[data-s=error] i{background:var(--err)}
.pill[data-s=paused] i{background:var(--warn)}
#panes{flex:1 1 0;min-height:200px;display:flex;gap:10px}
#log,#tree{flex:1 1 0;min-width:0;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#log{font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#log div{color:#c5cad4}
#log .net{color:var(--mut)}
#log .up{color:var(--up)}
#log .down,#log .ok{color:var(--ok)}
#log .warn{color:var(--warn)}
#log .err{color:var(--err)}
#tree{font:13px/1.6 ui-monospace,Consolas,monospace}
#tree .th{color:var(--mut);font-size:12px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#tree .te{color:var(--mut)}
#tree summary{cursor:pointer;padding:1px 0}
#tree details>*:not(summary){margin-left:16px}
#tree .tf{display:flex;align-items:center;gap:8px;color:#c5cad4}
#tree .tf i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
#tree .tf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#tree .tf span:hover{text-decoration:underline}
#tree .tf em{font-style:normal;color:var(--mut);font-size:12px}
#tree .ok i{background:var(--ok)}
#tree .loc i{background:var(--up)}
#tree .cld i{background:var(--warn)}
#tree .diff i{background:var(--err)}
#tree button.del{flex:none;width:22px;height:22px;padding:0;font-size:12px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--mut);cursor:pointer}
#tree button.del:hover{color:var(--err);border-color:var(--err)}
.bar{display:flex;justify-content:space-around;padding:8px 12px;background:#04202b;border:1px solid var(--line);border-radius:12px}
.bar button{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.bar button:hover{border-color:var(--mut)}
.bar button:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.bar button.main{border-color:#2f7fb3}
.bar button.danger{color:var(--err)}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:700px){#panes{flex-direction:column}}
</style>
</head>
<body>
<span class="pill" id="pill" data-s="idle"><i></i><span id="pillTxt">No folder</span></span>
<div id="panes">
  <div id="log" aria-live="off"></div>
  <div id="tree"><div class="te">No folder connected</div></div>
</div>
<div class="bar">
  <button class="main" id="bSetup" title="Create FFT folder &amp; sync" aria-label="Create FFT folder and sync"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg></button>
  <button id="bZip" title="Download FFT.zip" aria-label="Download FFT.zip"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg></button>
  <button class="danger" id="bRestore" title="Wipe folder and restore master" aria-label="Wipe folder and restore master"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button id="bMaster" title="Save current folder as master" aria-label="Save current folder as master"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></button>
  <button id="bCopy" title="Copy log" aria-label="Copy log"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
  <button id="bClear" title="Clear log" aria-label="Clear log"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
</div>

<script>
'use strict';
// ───────── Settings ─────────
const NAME = 'FFT';
const VERSION = '1.0';
const DB_URL = 'https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app';
const DB_PATH = 'extSync/fft';             // the only cloud branch this page touches
const POLL_MS = 3000;
const MAX_BYTES = 5 * 1024 * 1024;
const SKIP_DIRS = new Set(['.git', 'node_modules']);
const SKIP_FILE = /(^|\/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|\.crswap$|~$/;
document.title = NAME + ' Sync';

// ───────── Helpers ─────────
const $ = id => document.getElementById(id);
const DEVICE = (() => {
  let d = localStorage.getItem('fftsync.device');
  if (!d) { d = Math.random().toString(36).slice(2, 8); localStorage.setItem('fftsync.device', d); }
  return d;
})();
const lines = [], logEl = $('log');
function log(level, msg) {
  const line = new Date().toISOString().slice(11, 23) + ' [' + level + '] ' + msg;
  lines.push(line);
  if (lines.length > 3000) lines.shift();
  const d = document.createElement('div');
  d.className = level; d.textContent = line;
  logEl.appendChild(d);
  while (logEl.childElementCount > 1500) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(s, txt) { $('pill').dataset.s = s; $('pillTxt').textContent = txt; }
// Firebase keys: letters, digits, _ and - kept; everything else becomes ~XX (hex of UTF-8 byte)
const keyOf = p => Array.from(new TextEncoder().encode(p)).map(c => {
  const ch = String.fromCharCode(c);
  return /[A-Za-z0-9_-]/.test(ch) ? ch : '~' + c.toString(16).padStart(2, '0');
}).join('');
function b64enc(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(s) {
  const bin = atob(s), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
async function sha(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
}
const short = h => h ? h.slice(0, 8) : '-';
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ───────── IndexedDB (remembers the chosen folder) ─────────
const HANDLE_KEY = 'handle';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('fftsync', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const d = await idb();
  return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

// ───────── Firebase REST ─────────
async function db(method, sub, body, quiet) {
  const tries = method === 'POST' ? 1 : 5;
  let lastErr;
  for (let i = 1; i <= tries; i++) {
    try { return await dbOnce(method, sub, body, quiet); }
    catch (e) {
      lastErr = e;
      if (!/network error/i.test(e.message) || i === tries) break;
      log('warn', method + ' ' + (sub || '/') + ' attempt ' + i + ' failed (' + e.message + '), retrying');
      await sleep(1000 * i);
    }
  }
  throw lastErr;
}
async function dbOnce(method, sub, body, quiet) {
  const url = DB_URL + '/' + DB_PATH + (sub ? '/' + sub : '') + '.json';
  const t0 = performance.now();
  let r, data = null;
  try {
    r = await fetch(url, { method, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store', signal: AbortSignal.timeout(/^(blobs|history|master)\//.test(sub || '') ? 45000 : 15000) });
    if (method === 'GET' && r.ok) data = await r.json();
  } catch (e) {
    throw new Error(method + ' ' + sub + ' network error: ' + e.name + ' after ' + Math.round(performance.now() - t0) + ' ms');
  }
  const ms = Math.round(performance.now() - t0);
  if (!quiet) log('net', method + ' ' + (sub || '/') + ' → ' + r.status + ' (' + ms + ' ms)');
  else if (ms > 3000) log('warn', 'slow request: ' + method + ' ' + (sub || '/') + ' took ' + ms + ' ms');
  if (!r.ok) throw new Error(method + ' ' + sub + ' → HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' (denied: check Firebase rules)' : ''));
  return data;
}

// ───────── Local folder access ─────────
let root = null;
const BASE_KEY = 'fftsync.base';
let base = JSON.parse(localStorage.getItem(BASE_KEY) || '{}');   // path → hash at last sync
const hcache = new Map();                                        // path → {m,s,h}
const saveBase = () => localStorage.setItem(BASE_KEY, JSON.stringify(base));

async function scan(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') { if (!SKIP_DIRS.has(name)) await scan(h, prefix + name + '/', out); }
    else if (!SKIP_FILE.test(prefix + name)) out.set(prefix + name, h);
  }
}
const warned = new Set();
async function localState() {
  const handles = new Map(), out = new Map();
  await scan(root, '', handles);
  for (const [p, h] of handles) {
    const f = await h.getFile();
    if (f.size > MAX_BYTES) { if (!warned.has(p)) { warned.add(p); log('warn', 'skipping ' + p + ' (' + f.size + ' bytes > limit)'); } continue; }
    const c = hcache.get(p);
    let hash;
    if (c && c.m === f.lastModified && c.s === f.size) hash = c.h;
    else { hash = await sha(await f.arrayBuffer()); hcache.set(p, { m: f.lastModified, s: f.size, h: hash }); }
    out.set(p, { hash, mtime: f.lastModified, size: f.size });
  }
  return out;
}
async function dirFor(path, create) {
  const parts = path.split('/'), name = parts.pop();
  if (!name || parts.concat(name).some(s => !s || s === '.' || s === '..')) throw new Error('unsafe path: ' + path);
  let d = root;
  for (const s of parts) d = await d.getDirectoryHandle(s, { create });
  return { d, name };
}
async function readLocal(p) {
  const { d, name } = await dirFor(p, false);
  const f = await (await d.getFileHandle(name)).getFile();
  const buf = await f.arrayBuffer();
  return { buf, hash: await sha(buf), mtime: f.lastModified };
}
async function writeLocal(p, bytes) {
  const { d, name } = await dirFor(p, true);
  const w = await (await d.getFileHandle(name, { create: true })).createWritable();
  await w.write(bytes);
  await w.close();
}
async function deleteLocal(p) {
  const { d, name } = await dirFor(p, false);
  await d.removeEntry(name);
}

// ───────── Cloud operations (history keeps old versions) ─────────
let remote = {};
async function archiveCloud(p, reason) {
  const key = keyOf(p);
  const [m, b] = await Promise.all([db('GET', 'meta/' + key, undefined, true), db('GET', 'blobs/' + key, undefined, true)]);
  if (!m || m.deleted || b == null) return;
  await db('PUT', 'history/' + Date.now() + '_' + key, { path: p, hash: m.hash, mtime: m.mtime, content: b, reason, by: DEVICE });
  log('info', 'snapshot saved: ' + p + ' (' + reason + ')');
}
async function archiveLocal(p, reason) {
  const l = await readLocal(p);
  await db('PUT', 'history/' + Date.now() + '_' + keyOf(p), { path: p, hash: l.hash, mtime: l.mtime, content: b64enc(l.buf), reason, by: DEVICE });
  log('info', 'snapshot saved (local copy): ' + p + ' (' + reason + ')');
}
async function upload(p) {
  const l = await readLocal(p), key = keyOf(p);
  if (remote[p] && !remote[p].deleted) await archiveCloud(p, 'before overwrite');
  await db('PUT', 'blobs/' + key, b64enc(l.buf));
  await db('PUT', 'meta/' + key, { path: p, hash: l.hash, size: l.buf.byteLength, mtime: l.mtime, deleted: false, by: DEVICE });
  base[p] = l.hash;
  log('up', 'UPLOADED ' + p + ' (' + l.buf.byteLength + ' B, ' + short(l.hash) + ')');
}
async function download(p) {
  const b = await db('GET', 'blobs/' + keyOf(p));
  if (b == null) throw new Error('cloud has meta but no content for ' + p);
  const bytes = b64dec(b), hash = await sha(bytes);
  if (remote[p] && remote[p].hash !== hash) log('warn', 'cloud changed during download of ' + p + '; using what arrived');
  await writeLocal(p, bytes);
  base[p] = hash;
  hcache.delete(p);
  log('down', 'DOWNLOADED ' + p + ' (' + bytes.length + ' B, ' + short(hash) + ')');
}
async function purgeHistory(p) {
  const key = keyOf(p);
  try {
    const r = await fetch(DB_URL + '/' + DB_PATH + '/history.json?shallow=true', { cache: 'no-store', signal: AbortSignal.timeout(20000) });
    if (!r.ok) throw new Error('history list → HTTP ' + r.status);
    const ks = Object.keys((await r.json()) || {}).filter(k => k.slice(k.indexOf('_') + 1) === key);
    for (const k of ks) await db('DELETE', 'history/' + k, undefined, true);
    if (ks.length) log('info', 'purged ' + ks.length + ' old snapshot(s) of ' + p);
  } catch (e) { log('warn', 'could not purge snapshots of ' + p + ': ' + e.message); }
}
async function deleteCloud(p) {
  const key = keyOf(p);
  await purgeHistory(p);
  await db('PUT', 'meta/' + key, { path: p, deleted: true, hash: null, mtime: Date.now(), by: DEVICE });
  await db('DELETE', 'blobs/' + key);
  delete base[p];
  log('up', 'DELETED in cloud ' + p);
}
async function fetchRemote() {
  const rm = (await db('GET', 'meta', undefined, true)) || {}, out = {};
  for (const k in rm) if (rm[k] && rm[k].path) out[rm[k].path] = rm[k];
  return out;
}

// ───────── Sync cycle ─────────
let busy = false, paused = false, cycles = 0, announced = false, busySince = 0, lastSkipLog = 0, timer = null;
async function cycle(why) {
  if (!root) return;
  if (busy) {
    const s = Date.now() - busySince;
    if (s > 15000 && Date.now() - lastSkipLog > 30000) { lastSkipLog = Date.now(); log('warn', 'cycle "' + why + '" skipped: previous cycle still running (' + Math.round(s / 1000) + ' s)'); }
    return;
  }
  busy = true; busySince = Date.now();
  let errs = 0;
  try {
    if (!paused) setStatus('syncing', 'Syncing…');
    let loc = await localState();
    remote = await fetchRemote();
    let live = Object.values(remote).filter(m => !m.deleted).length;

    const acts = [];
    const paths = new Set([...loc.keys(), ...Object.keys(remote), ...Object.keys(base)]);
    for (const p of paths) {
      const L = loc.get(p), Rm = remote[p], R = Rm && !Rm.deleted ? Rm : null, B = base[p];
      const lh = L ? L.hash : null, rh = R ? R.hash : null;
      if (lh === rh) { if (lh) base[p] = lh; else delete base[p]; continue; }
      if (L && !R) {
        if (B && lh === B && Rm && Rm.deleted) acts.push(['dl', p, 'deleted on another device']);
        else if (B && lh !== B) acts.push(['up', p, 'edited locally']);
        else acts.push(['up', p, B ? 'missing in cloud, re-uploading' : 'new local file']);
      } else if (!L && R) {
        if (B && rh === B) acts.push(['dr', p, 'deleted locally']);
        else acts.push(['down', p, B ? 'changed in cloud (local copy was deleted)' : 'new cloud file']);
      } else {
        if (lh === B) acts.push(['down', p, 'changed in cloud']);
        else if (rh === B) acts.push(['up', p, 'edited locally']);
        else if (L.mtime >= R.mtime) acts.push(['up', p, 'conflict: local is newer (' + short(lh) + ' vs ' + short(rh) + ')']);
        else acts.push(['cdown', p, 'conflict: cloud is newer (' + short(lh) + ' vs ' + short(rh) + ')']);
      }
    }

    if (acts.length) {
      log('info', 'cycle ' + (++cycles) + ' (' + why + '): local ' + loc.size + ' files, cloud ' + live + ' files, ' + acts.length + ' change(s)');
      for (const [t, p, reason] of acts) {
        log('info', '• ' + t + ' ' + p + ': ' + reason);
        try {
          if (t === 'up') await upload(p);
          else if (t === 'down') await download(p);
          else if (t === 'cdown') { await archiveLocal(p, 'lost conflict'); await download(p); }
          else if (t === 'dl') { await deleteLocal(p); delete base[p]; log('down', 'DELETED locally ' + p); }
          else if (t === 'dr') await deleteCloud(p);
        } catch (e) { errs++; log('err', t + ' ' + p + ' failed: ' + e.message); }
      }
      remote = await fetchRemote();
      loc = await localState();
      live = Object.values(remote).filter(m => !m.deleted).length;
    } else if (++cycles % 10 === 0 || why === 'manual') {
      log('info', 'cycle ' + cycles + ' (' + why + '): all in sync, local ' + loc.size + ', cloud ' + live);
    }
    saveBase();
    drawTree(loc, remote);
    if (errs) setStatus('error', 'Error (see log)');
    else {
      setStatus(paused ? 'paused' : 'synced', paused ? 'Paused' : 'Synced');
      if (!announced) { announced = true; log('ok', 'DONE: folder is up to date with the cloud'); }
    }
  } catch (e) {
    if (e.name === 'NotFoundError') {
      if (timer) { clearInterval(timer); timer = null; }
      root = null;
      setStatus('paused', 'Folder missing: click ' + NAME + ' icon');
      log('err', 'connected folder no longer exists. Auto-sync stopped, cloud untouched. Click the ' + NAME + ' icon to reconnect.');
      return;
    }
    setStatus('error', e.message.indexOf('network') >= 0 ? 'Offline' : 'Error (see log)');
    log('err', 'cycle failed: ' + e.message);
  } finally { busy = false; }
}

// ───────── File tree ─────────
const treeClosed = {};
let treeSig = '';
const TREE_TIP = { ok: 'synced', loc: 'local only, uploading', cld: 'cloud only, downloading', diff: 'differs, resolving' };
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function treeNode(n, prefix, parent) {
  Object.keys(n.d).sort().forEach(name => {
    const path = prefix + name + '/', det = document.createElement('details'), sm = document.createElement('summary');
    det.open = !treeClosed[path];
    det.ontoggle = () => { treeClosed[path] = !det.open; };
    sm.textContent = name;
    det.appendChild(sm);
    treeNode(n.d[name], path, det);
    parent.appendChild(det);
  });
  n.f.forEach(f => {
    const row = document.createElement('div'), dot = document.createElement('i'), nm = document.createElement('span'), sz = document.createElement('em'), del = document.createElement('button');
    row.className = 'tf ' + f.st;
    row.title = f.name + ' · ' + TREE_TIP[f.st];
    nm.textContent = f.name;
    nm.onclick = () => openFile(prefix + f.name);
    sz.textContent = fmtSize(f.size);
    del.className = 'del'; del.textContent = '✕'; del.title = 'Delete ' + f.name;
    del.onclick = ev => { ev.stopPropagation(); deleteFile(prefix + f.name); };
    row.append(dot, nm, sz, del);
    parent.appendChild(row);
  });
}
function drawTree(loc, rem) {
  const files = {};
  loc.forEach((v, k) => { files[k] = { l: v, r: null }; });
  Object.keys(rem).forEach(k => {
    if (rem[k].deleted) return;
    (files[k] = files[k] || { l: null, r: null }).r = rem[k];
  });
  const paths = Object.keys(files).sort(), sig = [], tree = { d: {}, f: [] };
  let ok = 0, pend = 0;
  paths.forEach(path => {
    const f = files[path], st = f.l && f.r ? (f.l.hash === f.r.hash ? 'ok' : 'diff') : (f.l ? 'loc' : 'cld');
    const parts = path.split('/'), name = parts.pop(), size = (f.l || f.r).size;
    let n = tree;
    parts.forEach(s => { n = n.d[s] || (n.d[s] = { d: {}, f: [] }); });
    n.f.push({ name, st, size });
    sig.push(path + '|' + st + '|' + size);
    if (st === 'ok') ok++; else pend++;
  });
  const sg = root.name + '#' + sig.join('\n');
  if (sg === treeSig) return;
  treeSig = sg;
  const el = $('tree'), keep = el.scrollTop, head = document.createElement('div');
  el.textContent = '';
  head.className = 'th';
  head.textContent = root.name + ' · ' + paths.length + ' files · ' + ok + ' synced' + (pend ? ' · ' + pend + ' pending' : '');
  el.appendChild(head);
  if (!paths.length) { const e = document.createElement('div'); e.className = 'te'; e.textContent = 'No files yet'; el.appendChild(e); }
  else treeNode(tree, '', el);
  el.scrollTop = keep;
}

// ───────── Polling loop ─────────
let lastTick = 0, tickWorker = null;
function startLoop() {
  if (timer) clearInterval(timer);
  if (tickWorker) { tickWorker.terminate(); tickWorker = null; }
  lastTick = Date.now();
  const tick = () => {
    const now = Date.now(), gap = now - lastTick;
    if (gap < POLL_MS - 500) return;
    lastTick = now;
    if (gap > POLL_MS * 3) log('warn', 'poll was delayed ' + Math.round(gap / 1000) + ' s (browser throttles hidden tabs; keep this page visible or in its own window)');
    if (!paused) cycle('auto');
  };
  timer = setInterval(tick, POLL_MS);
  try {
    tickWorker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},' + POLL_MS + ')'], { type: 'text/javascript' })));
    tickWorker.onmessage = tick;
  } catch (e) { tickWorker = null; }
}

// ───────── Folder connect ─────────
async function useFolder(h, fresh) {
  root = h; announced = false; treeSig = '';
  if (fresh) { base = {}; hcache.clear(); saveBase(); }
  log('ok', 'folder connected: "' + h.name + '"' + (fresh ? ' (new connection, sync history reset)' : ' (restored)'));
  startLoop();
  await cycle('connect');
}
async function setup() {
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  log('info', NAME + ' setup: pick where the ' + NAME + ' folder should be created (browser will ask for permission)');
  let parent, h, existed = true;
  try { parent = await window.showDirectoryPicker({ mode: 'readwrite', id: 'fftsyncparent', startIn: 'documents' }); }
  catch (e) { log('warn', 'setup cancelled: ' + e.name); return; }
  try {
    if (parent.name === NAME) h = parent;
    else {
      try { await parent.getDirectoryHandle(NAME); } catch (e) { existed = false; }
      h = await parent.getDirectoryHandle(NAME, { create: true });
    }
  } catch (e) { log('err', 'could not create ' + NAME + ': ' + e.message); return; }
  log('ok', 'permission granted · folder ' + NAME + (existed ? ' ready (already existed)' : ' CREATED') + ' inside "' + parent.name + '"');
  await idbSet(HANDLE_KEY, h);
  await useFolder(h, true);
  log('ok', NAME + ' connected: cloud files downloaded, auto-sync running (add/edit/delete syncs both ways)');
}

// ───────── File actions ─────────
const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf' };
async function openFile(p) {
  try {
    const l = await readLocal(p), ext = p.split('.').pop().toLowerCase();
    const url = URL.createObjectURL(new Blob([l.buf], { type: MIME[ext] || 'text/plain;charset=utf-8' }));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { log('warn', 'cannot open ' + p + ': ' + e.message + ' (it may still be downloading)'); }
}
async function deleteFile(p) {
  if (!root || !confirm('Delete "' + p + '" from the folder and the cloud?')) return;
  try {
    try { await deleteLocal(p); } catch (e) { if (e.name !== 'NotFoundError') throw e; }
    await deleteCloud(p);
    hcache.delete(p); delete base[p]; saveBase();
    log('ok', 'deleted ' + p);
    cycle('manual');
  } catch (e) { log('err', 'delete ' + p + ' failed: ' + e.message); }
}
async function lockSync() {
  while (busy) await sleep(200);
  busy = true; busySince = Date.now();
}
async function pruneEmpty(dir) {
  let empty = true;
  const subs = [];
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory' && !SKIP_DIRS.has(name)) subs.push(name); else empty = false;
  }
  for (const s of subs) {
    if (await pruneEmpty(await dir.getDirectoryHandle(s))) await dir.removeEntry(s); else empty = false;
  }
  return empty;
}

// ───────── Master snapshot ─────────
async function saveMaster() {
  if (!root) { log('warn', 'connect the ' + NAME + ' folder first'); return; }
  if (!confirm('Save the current ' + NAME + ' folder as the new master version?\nThis replaces the previously saved master.')) return;
  await lockSync();
  try {
    setStatus('syncing', 'Saving master…');
    const paths = Array.from((await localState()).keys());
    if (!paths.length) { log('warn', 'folder is empty: master not changed'); return; }
    const oldMeta = (await db('GET', 'master/meta', undefined, true)) || {}, meta = {};
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i], l = await readLocal(p), key = keyOf(p);
      await db('PUT', 'master/blobs/' + key, b64enc(l.buf), true);
      meta[key] = { path: p, hash: l.hash, size: l.buf.byteLength };
      if ((i + 1) % 10 === 0) log('info', 'master: ' + (i + 1) + '/' + paths.length + ' files saved');
    }
    await db('PUT', 'master/meta', meta, true);
    await db('PUT', 'master/info', { savedAt: Date.now(), count: paths.length, by: DEVICE }, true);
    for (const key in oldMeta) if (!meta[key]) await db('DELETE', 'master/blobs/' + key, undefined, true);
    log('ok', 'MASTER saved: ' + paths.length + ' files');
  } catch (e) { log('err', 'save master failed: ' + e.message); }
  finally { busy = false; }
}
async function restoreMaster() {
  if (!root) { log('warn', 'connect the ' + NAME + ' folder first'); return; }
  let info;
  try { info = await db('GET', 'master/info', undefined, true); }
  catch (e) { log('err', 'cannot reach cloud: ' + e.message); return; }
  if (!info) { log('warn', 'no master saved yet: use the save-master button first'); return; }
  if (!confirm('WIPE the current ' + NAME + ' folder and restore the master saved ' + new Date(info.savedAt).toLocaleString() + ' (' + info.count + ' files)?\n\nFiles that are not in the master will be deleted here and in the cloud.')) return;
  let wiping = false;
  await lockSync();
  try {
    setStatus('syncing', 'Restoring master…');
    const meta = (await db('GET', 'master/meta', undefined, true)) || {}, keys = Object.keys(meta), files = [];
    if (!keys.length) throw new Error('master is empty');
    for (const k of keys) {
      const m = meta[k], b = await db('GET', 'master/blobs/' + k, undefined, true);
      if (b == null) throw new Error('master content missing for ' + m.path);
      const bytes = b64dec(b);
      if (await sha(bytes) !== m.hash) throw new Error('master file damaged: ' + m.path);
      files.push({ p: m.path, bytes });
    }
    log('info', 'master verified: ' + files.length + ' files, wiping folder');
    wiping = true; paused = true;
    const handles = new Map();
    await scan(root, '', handles);
    for (const [p, h] of handles) {
      if ((await h.getFile()).size > MAX_BYTES) { log('warn', 'kept ' + p + ' (too large to sync)'); continue; }
      await deleteLocal(p); hcache.delete(p);
    }
    await pruneEmpty(root);
    for (const f of files) { await writeLocal(f.p, f.bytes); hcache.delete(f.p); }
    log('ok', 'MASTER restored: ' + files.length + ' files written');
  } catch (e) {
    log('err', 'restore master failed: ' + e.message);
    if (wiping) {
      setStatus('paused', 'Restore failed');
      log('err', 'restore stopped midway: auto-sync paused so the cloud stays untouched. Click restore again to retry.');
      return;
    }
  } finally { busy = false; }
  paused = false;
  cycle('restore');
}

// ───────── ZIP download (stored, no compression) ─────────
const CRC_T = (() => {
  const t = [];
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function downloadZip() {
  if (!root) { log('warn', 'connect the ' + NAME + ' folder first'); return; }
  try {
    let fh = null;
    if (window.showSaveFilePicker) {
      try { fh = await window.showSaveFilePicker({ suggestedName: NAME + '.zip', types: [{ description: 'ZIP archive', accept: { 'application/zip': ['.zip'] } }] }); }
      catch (e) { if (e.name === 'AbortError') { log('warn', 'zip save cancelled'); return; } log('warn', 'save dialog unavailable: ' + e.name); }
    }
    const handles = new Map();
    await scan(root, '', handles);
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0, csize = 0, count = 0;
    for (const [p, h] of handles) {
      const f = await h.getFile(), data = new Uint8Array(await f.arrayBuffer()), name = enc.encode(p), crc = crc32(data), d = new Date(f.lastModified);
      const dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
      const tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      parts.push(lh.buffer, name, data);
      central.push(ch.buffer, name);
      csize += 46 + name.length;
      offset += 30 + name.length + data.length;
      count++;
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, count, true); end.setUint16(10, count, true);
    end.setUint32(12, csize, true); end.setUint32(16, offset, true);
    const blob = new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
    if (fh) {
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = NAME + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    log('ok', NAME + '.zip saved (' + count + ' files, ' + blob.size + ' B)');
  } catch (e) { log('err', 'zip failed: ' + e.message); }
}

// ───────── Wiring ─────────
async function resumeFolder() {
  try {
    const h = await idbGet(HANDLE_KEY);
    if (!h) return false;
    const p = await h.requestPermission({ mode: 'readwrite' });
    log('info', 'folder permission: ' + p);
    if (p !== 'granted') return false;
    await useFolder(h, false);
    return true;
  } catch (e) { log('warn', 'could not reconnect saved folder: ' + e.message); return false; }
}
function armReconnect() {
  const go = async ev => {
    if (root) { document.removeEventListener('click', go, true); document.removeEventListener('keydown', go, true); return; }
    if (ev.target.closest && ev.target.closest('.bar')) return;   // icon buttons handle themselves
    document.removeEventListener('click', go, true);
    document.removeEventListener('keydown', go, true);
    if (!(await resumeFolder())) setStatus('paused', 'Click ' + NAME + ' icon to choose folder');
  };
  document.addEventListener('click', go, true);
  document.addEventListener('keydown', go, true);
}
$('bSetup').onclick = async () => {
  if (root) { if (!confirm('Switch to a different folder? The current connection will be replaced.')) return; }
  else if (await resumeFolder()) return;
  await setup();
};
$('bZip').onclick = downloadZip;
$('bMaster').onclick = saveMaster;
$('bRestore').onclick = restoreMaster;
$('bClear').onclick = () => { lines.length = 0; logEl.textContent = ''; };
$('bCopy').onclick = async () => {
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); log('ok', 'log copied (' + lines.length + ' lines)'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    log('ok', 'log copied (fallback, ' + lines.length + ' lines)');
  }
};
document.addEventListener('visibilitychange', () => {
  log('net', 'tab ' + document.visibilityState);
  if (document.visibilityState === 'visible' && !paused) cycle('tab visible');
});
window.addEventListener('error', e => log('err', 'uncaught: ' + e.message));
window.addEventListener('unhandledrejection', e => log('err', 'unhandled: ' + (e.reason && e.reason.message || e.reason)));

// ───────── Startup ─────────
(async function init() {
  log('info', NAME + ' Sync v' + VERSION + ' · device ' + DEVICE);
  try { if (navigator.locks) navigator.locks.request('fftsync-keepalive', () => new Promise(() => {})); } catch (e) {}
  log('info', 'secure context: ' + window.isSecureContext + ' · folder API: ' + !!window.showDirectoryPicker + ' · crypto: ' + !!(window.crypto && crypto.subtle));
  log('info', 'cloud: ' + DB_URL + '/' + DB_PATH);
  try {
    const m = (await db('GET', 'meta')) || {};
    log('ok', 'cloud reachable, ' + Object.keys(m).length + ' entries');
    setStatus('idle', 'No folder');
  } catch (e) { log('err', 'cloud check failed: ' + e.message); setStatus('error', 'Cloud unreachable'); }
  try {
    const h = await idbGet(HANDLE_KEY);
    if (h) {
      const p = await h.queryPermission({ mode: 'readwrite' });
      log('info', 'saved folder "' + h.name + '", permission: ' + p);
      if (p === 'granted') await useFolder(h, false);
      else {
        setStatus('paused', 'Click anywhere to reconnect "' + h.name + '"');
        log('info', 'click anywhere on the page to reconnect the saved folder');
        armReconnect();
      }
    }
  } catch (e) { log('warn', 'could not restore saved folder: ' + e.message); }
})();
</script>
